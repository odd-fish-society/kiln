# Kiln builds itself from the seed (the release build/seed.env pins), then
# builds and runs its suite with GCC, with Clang and under ASan and UBSan (the
# boundary lint included), checks that Kiln rebuilding itself converges
# byte for byte, and runs the setup-kiln action against a published release.
#
# The nested submodules (Luau, cluau, hamr) are checked out at the commits
# this commit pins.
name: Linux

# dev is where streams land and every push is checked. main moves only to a
# dev commit that already passed here, so it is not checked again. A stream
# runs it only when started by hand (Run workflow on the Actions tab).
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# Read-only: pull requests from forks run this too.
permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc, args: '--tool cxx=g++ --tool cc=gcc' }
          - { name: clang, args: '--tool cxx=clang++ --tool cc=clang' }
          - { name: ASan + UBSan, args: '--config dev-asan-ubsan' }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The seed builds today's Kiln, and that Kiln builds the suite (with the
      # kiln binary under test beside it) and runs it.
      - name: Kiln
        run: |
          seed=$(./seed.sh)
          "$seed" build kiln --progress=plain
          cp .kiln/out/linux-release/bin/kiln "$RUNNER_TEMP/kiln"

      - name: Suite
        run: '"$RUNNER_TEMP/kiln" test kiln_tests ${{ matrix.args }}'

  bootstrap:
    name: bootstrap convergence
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The seed builds Kiln, that Kiln builds itself, and the result builds
      # itself again from a fresh state: the last two must be byte-identical.
      - name: Bootstrap
        run: ./bootstrap.sh

  setup-kiln:
    name: setup-kiln action
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The action as this commit has it, installing a published release.
      - id: kiln
        uses: ./.github/actions/setup-kiln
        with:
          version: 0.3.0
          cache-store: 'false'

      - name: Check
        run: |
          kiln --version | grep -x 'kiln 0.3.0'
          test -x "${{ steps.kiln.outputs.kiln }}"
          test -d .kiln/store/releases/0.3.0
